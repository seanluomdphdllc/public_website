<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lexicon Quest — Endless</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Lexend:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#12100f;--moss:#2e4a2a;--parch:#e8dcc0;--amber:#e8a33d;--gold:#f0d264;
    --blood:#a83232;--dim:#7d7361;--spirit:#9fc7e0;
    --b1:#c0563f;--b2:#e8a33d;--b3:#8fb85a;--b4:#6fb8c8;--b5:#f0d264;
    --pixel:"Silkscreen","Courier New",monospace;--read:"Lexend",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--ink);color:var(--parch);font-family:var(--read)}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px 12px 28px;
    background:radial-gradient(circle at 50% 0%,#23302a 0%,#12100f 70%)}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges}
  .shell{width:100%;max-width:660px}
  .win{border:3px solid var(--parch);outline:3px solid var(--ink);background:#171e1a;box-shadow:0 0 0 3px #3a4a40}

  #hud{display:flex;align-items:center;gap:13px;flex-wrap:wrap;padding:10px 12px;margin-bottom:10px}
  #swordCanvas{width:34px;height:34px;flex:none}
  .hud-block{display:flex;flex-direction:column;gap:3px;min-width:0}
  .hud-name{font-family:var(--pixel);font-size:13px;color:var(--gold)}
  .hud-sub{font-size:11px;color:var(--dim)}
  #hearts{font-size:17px;letter-spacing:2px;line-height:1;color:var(--blood)}
  #hearts .empty{color:#3a3128}
  .hud-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .counter{font-family:var(--pixel);font-size:13px}
  .counter small{color:var(--dim);font-family:var(--read);font-size:10px;display:block}
  #streak{letter-spacing:3px;font-size:14px;color:var(--amber);line-height:1}
  #streak .off{color:#3a3128}

  #bar{height:8px;background:#22201c;border:2px solid #3a4a40;margin-bottom:10px;position:relative}
  #bar i{display:block;height:100%;background:linear-gradient(90deg,#4a7a3a,#8fb85a);width:0%}

  button{font-family:var(--pixel);font-size:12px;color:var(--ink);background:var(--parch);
    border:3px solid var(--ink);outline:2px solid var(--parch);padding:8px 12px;cursor:pointer;
    transition:transform .06s,background .12s}
  button:hover{background:var(--gold)}
  button:active{transform:translateY(2px)}
  button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
  button.ghost{background:transparent;color:var(--parch);outline-color:var(--dim);border-color:var(--dim)}
  button.ghost:hover{background:#2a3630;color:var(--gold)}
  button:disabled{opacity:.4;cursor:not-allowed}

  #worldWrap{position:relative;line-height:0}
  #world{width:100%;height:auto;display:block;background:#1b2a24}
  #hint{font-size:12px;color:var(--dim);text-align:center;margin:8px 0 0;line-height:1.5}
  #pad{display:none;grid-template-columns:repeat(3,52px);gap:6px;justify-content:center;margin-top:12px}
  #pad button{padding:14px 0;font-size:14px}
  #pad .sp{visibility:hidden}
  @media (hover:none){#pad{display:grid}}

  #overlay{position:fixed;inset:0;background:rgba(9,8,7,.9);display:none;align-items:center;
    justify-content:center;padding:16px;z-index:20}
  #overlay.on{display:flex}
  #panel{width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:20px}

  .stage{display:flex;align-items:center;gap:16px;margin-bottom:14px}
  .stage canvas{width:72px;height:72px;flex:none}
  .stage.boss canvas{width:110px;height:110px}
  .foe{font-family:var(--pixel);font-size:14px;color:var(--blood)}
  .foe.spirit{color:var(--spirit)}
  .foehp{font-size:13px;letter-spacing:3px;color:var(--blood);margin-top:5px}
  .foehp .gone{color:#3a3128}

  .wordline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:2px}
  .word{font-family:var(--pixel);font-size:25px;color:var(--gold);line-height:1.15;word-break:break-word;margin:0}
  .speak{font-family:var(--pixel);font-size:11px;padding:6px 10px;background:#2f3d34;color:var(--gold);
    border:2px solid var(--moss);outline:none;flex:none}
  .speak:hover{background:var(--moss);color:#eafce2}
  .speak.dead{opacity:.45;cursor:default}
  .respell{font-family:var(--pixel);font-size:12px;color:var(--spirit)}
  .def{font-size:16px;line-height:1.55;margin:10px 0 12px}
  .ex{font-size:14px;line-height:1.6;color:#cbbf9f;border-left:3px solid var(--moss);padding-left:12px;margin:0 0 6px}

  .q{font-size:16px;line-height:1.55;margin:0 0 14px}
  .q b{color:var(--gold);font-family:var(--pixel);font-size:16px}
  .blank{color:var(--amber);letter-spacing:1px}
  .opts{display:grid;gap:8px;margin-bottom:6px}
  .opt{text-align:left;font-family:var(--read);font-size:15px;padding:11px 14px;background:#222c26;
    color:var(--parch);border:2px solid #3d4c43;outline:none}
  .opt:hover{background:#2f3d34;color:var(--gold);border-color:var(--moss)}
  .opt.right{background:var(--moss);color:#eafce2;border-color:#7ec86a}
  .opt.wrong{background:#4a1f1f;color:#ffd9d9;border-color:var(--blood)}
  .scaf{font-family:var(--pixel);font-size:19px;color:var(--amber);letter-spacing:5px;margin:0 0 4px;word-break:break-all}
  .scaf .hid{color:#5c6b5e}
  .scaflen{font-family:var(--read);font-size:11px;color:var(--dim);letter-spacing:0;margin:0 0 8px}
  .hints{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .hints button{font-size:10px;padding:5px 9px}
  .cue{font-size:14px;line-height:1.55;color:#cbbf9f;border-left:3px solid var(--moss);
    padding-left:11px;margin:0 0 10px}
  .typebox{display:flex;gap:8px;margin-bottom:6px}
  .typebox input{flex:1;min-width:0;font-family:var(--read);font-size:17px;padding:11px 13px;
    background:#222c26;color:var(--parch);border:2px solid #3d4c43;outline:none}
  .typebox input:focus{border-color:var(--amber)}

  .timer{height:12px;background:#22201c;border:2px solid #3d4c43;margin-bottom:14px;position:relative}
  .timer i{display:block;height:100%;background:var(--moss);width:100%}
  .timer.warn i{background:var(--amber)}
  .timer.crit i{background:var(--blood)}
  .timer span{position:absolute;right:5px;top:-1px;font-family:var(--pixel);font-size:9px;color:var(--parch);line-height:12px}

  .verdict{font-size:15px;line-height:1.55;margin:12px 0 0;padding:12px;border:2px solid #3d4c43;background:#20281f}
  .verdict.good{border-color:#7ec86a}
  .verdict.bad{border-color:var(--blood)}
  .verdict strong{font-family:var(--pixel);font-size:13px;display:block;margin-bottom:5px}
  .verdict.good strong{color:#9ade86}
  .verdict.bad strong{color:#f08b8b}

  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .title{font-family:var(--pixel);font-size:19px;color:var(--gold);margin:0 0 10px;line-height:1.3}
  .body{font-size:15px;line-height:1.6;margin:0 0 8px}
  .body em{color:var(--amber);font-style:normal}
  .rate{display:grid;gap:8px;margin-top:6px}
  .rate button{text-align:left;font-family:var(--read);font-size:15px;padding:12px 14px;background:#222c26;
    color:var(--parch);border:2px solid #3d4c43;outline:none}
  .rate button:hover{background:#2f3d34;color:var(--gold);border-color:var(--moss)}
  .rate b{font-family:var(--pixel);font-size:12px;display:block;color:var(--gold);margin-bottom:3px}
  .rate small{color:var(--dim);font-size:12px}

  .filters{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
  .filters input{flex:1;min-width:140px;font-family:var(--read);font-size:15px;padding:9px 11px;
    background:#222c26;color:var(--parch);border:2px solid #3d4c43;outline:none}
  .filters input:focus{border-color:var(--amber)}
  .filters select{font-family:var(--read);font-size:14px;padding:9px;background:#222c26;
    color:var(--parch);border:2px solid #3d4c43}
  .codex{display:grid;gap:11px;margin-top:6px;max-height:52vh;overflow:auto;padding-right:4px}
  .codex .item{border-left:3px solid var(--moss);padding-left:11px}
  .codex .item.s1{border-left-color:var(--b1)}
  .codex .item.s2{border-left-color:var(--b2)}
  .codex .item.s3{border-left-color:var(--b3)}
  .codex .item.s4{border-left-color:var(--b4)}
  .codex .item.s5{border-left-color:var(--b5)}
  .codex b{font-family:var(--pixel);color:var(--gold);font-size:14px}
  .codex p{margin:3px 0 0;font-size:14px;line-height:1.5}
  .codex .strength{font-size:11px;color:var(--dim);letter-spacing:2px}

  .code{width:100%;font-family:"Courier New",monospace;font-size:11px;padding:10px;background:#222c26;
    color:var(--spirit);border:2px solid #3d4c43;outline:none;word-break:break-all;resize:vertical;min-height:96px}
  .code:focus{border-color:var(--amber)}

  .shake{animation:sh .3s}
  @keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  @media (prefers-reduced-motion:reduce){.shake{animation:none}}
</style>

<div class="shell">
  <div id="hud" class="win">
    <canvas id="swordCanvas" width="48" height="48"></canvas>
    <div class="hud-block">
      <div class="hud-name" id="swordName">Rusty Blade</div>
      <div class="hud-sub" id="swordSub">12s per answer</div>
    </div>
    <div class="hud-block">
      <div id="hearts"></div>
      <div class="hud-sub">health</div>
    </div>
    <div class="hud-block">
      <div id="streak"></div>
      <div class="hud-sub">to the forge</div>
    </div>
    <div class="hud-right">
      <div class="counter"><span id="mastered">0</span><small>mastered</small></div>
      <div class="counter"><span id="dueCount" style="color:#e8a33d">0</span><small>shaky</small></div>
      <button class="ghost" id="codexBtn">Codex</button>
      <button class="ghost" id="saveBtn">Save</button>
    </div>
  </div>

  <div id="bar" class="win" style="box-shadow:none;outline:none"><i></i></div>

  <div id="worldWrap" class="win"><canvas id="world" width="640" height="384"></canvas></div>
  <p id="hint">Arrow keys or WASD. Gold monsters carry a new word; coloured spirits carry a word you already met.</p>

  <div id="pad">
    <button class="sp"></button><button data-d="up">▲</button><button class="sp"></button>
    <button data-d="left">◀</button><button class="sp"></button><button data-d="right">▶</button>
    <button class="sp"></button><button data-d="down">▼</button><button class="sp"></button>
  </div>
</div>

<div id="overlay"><div id="panel" class="win"></div></div>

<script>

function drawSprite(ctx,name,x,y,scale,alpha,pal){
  const sp=SPRITES[name]; if(!sp) return;
  const P=pal||sp.pal;
  ctx.save(); if(alpha!==undefined) ctx.globalAlpha=alpha;
  for(let r=0;r<sp.px.length;r++){const row=sp.px[r];
    for(let c=0;c<row.length;c++){const ch=row[c];
      if(ch==="."||!P[ch]) continue;
      ctx.fillStyle=P[ch]; ctx.fillRect(x+c*scale,y+r*scale,scale,scale);}}
  ctx.restore();
}

function dueList(){
  const o=[];
  for(let i=0;i<N;i++){ if(!S.box[i]) continue;
    if(S.battles-S.lastB[i]>=INTERVAL[S.box[i]]) o.push(i); }
  return o.sort((a,b)=>S.box[a]-S.box[b]);
}
const unseenList=()=>{const o=[];for(let i=0;i<N;i++) if(!S.box[i]) o.push(i); return o;};

function beep(f,d,t){try{
  const A=window.__ac||(window.__ac=new (window.AudioContext||window.webkitAudioContext)());
  const o=A.createOscillator(),g=A.createGain();
  o.type=t||"square";o.frequency.value=f;
  g.gain.setValueAtTime(.05,A.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,A.currentTime+d);
  o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+d);}catch(e){}}

/* ---------- save ---------- */
const KEY="lexiconquest3:save";
const b36=n=>{const s=Math.max(0,Math.min(1295,n|0)).toString(36); return s.length<2?"0"+s:s;};
function toCode(){
  let pay="";
  for(let i=0;i<N;i++) pay += String(S.box[i]) + b36(S.box[i]?S.battles-S.lastB[i]:0);
  const head=JSON.stringify({v:3,n:N,t:S.tier,b:S.battles,s:S.streak,c:S.crowns,x:S.px,y:S.pr,m:S.maxhp});
  return btoa(unescape(encodeURIComponent(head+"|"+pay))).replace(/=+$/,"");
}
function fromCode(code){
  try{
    const raw=decodeURIComponent(escape(atob(code.trim().replace(/\s+/g,""))));
    const cut=raw.indexOf("|"); if(cut<0) return false;
    const h=JSON.parse(raw.slice(0,cut)), pay=raw.slice(cut+1);
    if(h.v!==3||h.n!==N||pay.length!==N*3) return false;
    S.tier=h.t|0; S.battles=h.b|0; S.streak=Math.min(FORGE_AT,h.s|0); S.crowns=h.c|0;
    S.px=h.x||1; S.pr=h.y||1; S.maxhp=Math.min(MAXHP,Math.max(5,h.m||5)); S.hp=S.maxhp;
    for(let i=0;i<N;i++){
      const b=+pay[i*3]; const d=parseInt(pay.substr(i*3+1,2),36)||0;
      S.box[i]=(b>=0&&b<=MASTER)?b:0;
      S.lastB[i]=S.box[i]?S.battles-d:0;
    }
    S.mons=[]; S.recent=[]; fillMap();
    return true;
  }catch(e){ return false; }
}
let AUTOSAVE=false;
async function autosave(){try{ if(!window.storage) return;
  await window.storage.set(KEY,toCode()); AUTOSAVE=true; }catch(e){AUTOSAVE=false;}}
async function autoload(){try{ if(!window.storage) return false;
  const r=await window.storage.get(KEY); AUTOSAVE=true;
  if(r&&r.value) return fromCode(r.value);
}catch(e){AUTOSAVE=false;} return false;}

/* ---------- map population ---------- */
function occupied(){
  const s=new Set([S.px+","+S.pr, FORGE.c+","+FORGE.r, SHRINE.c+","+SHRINE.r]);
  S.mons.forEach(m=>s.add(m.c+","+m.r));
  return s;
}
function freeTile(){
  const taken=occupied(), open=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)
    if(at(c,r)==="."&&!taken.has(c+","+r)) open.push({c,r});
  return open.length?open[Math.random()*open.length|0]:null;
}
function pickWord(){
  const onMap=new Set(S.mons.map(m=>m.i));
  const due=dueList().filter(i=>!onMap.has(i));
  const unseen=unseenList().filter(i=>!onMap.has(i));
  let i=null;
  if(due.length&&(!unseen.length||Math.random()<0.6)) i=due[Math.random()*Math.min(8,due.length)|0];
  else if(unseen.length) i=unseen[Math.random()*unseen.length|0];
  else if(due.length) i=due[0];
  else { // nothing due, nothing unseen: pull the weakest word anyway
    const all=[...Array(N).keys()].filter(k=>!onMap.has(k)).sort((a,b)=>S.box[a]-S.box[b]);
    i=all.length?all[Math.random()*Math.min(10,all.length)|0]:null;
  }
  return i;
}
function spawnOne(){
  const i=pickWord(); if(i===null) return;
  const t=freeTile(); if(!t) return;
  S.mons.push({i,c:t.c,r:t.r,fresh:S.box[i]===0,sp:NEWSPR[i%3]});
}
function fillMap(){ while(S.mons.length<SLOTS) { const before=S.mons.length; spawnOne(); if(S.mons.length===before) break; } }

/* ---------- world ---------- */
const noise=(c,r)=>((c*73856093)^(r*19349663))>>>0;
function drawWorld(){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const t=at(c,r),x=c*TS,y=r*TS,n=noise(c,r);
    if(t==="~"){wctx.fillStyle="#2b4d63";wctx.fillRect(x,y,TS,TS);
      wctx.fillStyle="#3a6480";wctx.fillRect(x+((n%3)*8),y+8+((n>>3)%2)*10,14,3);}
    else{wctx.fillStyle="#25392c";wctx.fillRect(x,y,TS,TS);
      wctx.fillStyle="#2c4433";wctx.fillRect(x+((n%4)*7),y+((n>>2)%4)*7,4,4);
      wctx.fillRect(x+16+((n>>4)%3)*4,y+18+((n>>6)%3)*4,3,3);}
    if(t==="T"){wctx.fillStyle="#3d2f21";wctx.fillRect(x+13,y+18,6,12);
      wctx.fillStyle="#1f3a24";wctx.fillRect(x+4,y+4,24,18);
      wctx.fillStyle="#2b5231";wctx.fillRect(x+7,y+7,12,8);}
  }
  const now=Date.now();
  // forge
  const flit=S.streak>=FORGE_AT&&forgeUseful();
  drawSprite(wctx,"forge",FORGE.c*TS+4,FORGE.r*TS+4,2,flit?1:.28);
  if(flit){wctx.fillStyle="#e8a33d";wctx.fillRect(FORGE.c*TS+15,FORGE.r*TS-4,3,6);wctx.fillRect(FORGE.c*TS+15,FORGE.r*TS+3,3,3);}
  // shrine
  wctx.fillStyle="#3a1414"; wctx.fillRect(SHRINE.c*TS-16,SHRINE.r*TS-14,64,62);
  drawSprite(wctx,"wyrm",SHRINE.c*TS-16,SHRINE.r*TS-12+Math.sin(now/380)*1.5,4,1);
  // monsters
  for(const m of S.mons){
    const x=m.c*TS+4,y=m.r*TS+4,bob=Math.sin(now/380+m.c)*1.5;
    if(m.fresh){
      drawSprite(wctx,m.sp,x,y+bob,2,1);
      wctx.fillStyle="#f0d264";wctx.fillRect(x+11,y-8,3,6);wctx.fillRect(x+11,y-1,3,3);
    }else{
      const b=S.box[m.i]||1;
      drawSprite(wctx,"ghost",x,y+Math.sin(now/300+m.c*2)*2.5,2,.6+.25*Math.sin(now/500+m.c),spiritPal(b));
      wctx.fillStyle=BOXCOL[b];
      wctx.fillRect(x+10,y-8,5,2);wctx.fillRect(x+12,y-6,2,4);
    }
  }
  const x=(S.px+S.ox)*TS+4,y=(S.pr+S.oy)*TS+2;
  drawSprite(wctx,"knight",x,y,2,1);
  const L=swordLook(S.tier); wctx.fillStyle=L.blade;
  if(S.face==="left"){wctx.fillRect(x-5,y+10,4,12);wctx.fillRect(x-8,y+18,10,3);}
  else{wctx.fillRect(x+25,y+10,4,12);wctx.fillRect(x+22,y+18,10,3);}
}
function loop(){
  if(S.moving){const sp=.14;
    if(S.dir==="left")S.ox=Math.min(0,S.ox+sp);
    if(S.dir==="right")S.ox=Math.max(0,S.ox-sp);
    if(S.dir==="up")S.oy=Math.min(0,S.oy+sp);
    if(S.dir==="down")S.oy=Math.max(0,S.oy-sp);
    if(S.ox===0&&S.oy===0)S.moving=false;}
  drawWorld();
  if(S.mode==="q") tickTimer();
  requestAnimationFrame(loop);
}

/* ---------- movement ---------- */
function step(dir){
  if(S.mode!=="world"||S.moving) return;
  S.dir=dir; if(dir==="left"||dir==="right") S.face=dir;
  const d={left:[-1,0],right:[1,0],up:[0,-1],down:[0,1]}[dir];
  const nc=S.px+d[0],nr=S.pr+d[1];
  if(nc===FORGE.c&&nr===FORGE.r) return bumpForge();
  if(nc===SHRINE.c&&nr===SHRINE.r) return startBoss();
  const m=S.mons.find(o=>o.c===nc&&o.r===nr);
  if(m) return m.fresh?startNew(m):startReview(m);
  if(at(nc,nr)!==".") return;
  S.px=nc;S.pr=nr;S.ox=-d[0];S.oy=-d[1];S.moving=true;
}

/* ---------- questions ---------- */
function makeQ(idx,kind){
  const W=WORDS[idx];
  if(kind==="mc-syn") return {kind:"mc",idx,prompt:`Which word means most nearly the same as <b>${W.w}</b>?`,
    opts:shuffle([W.s,...W.x]),answer:W.s};
  if(kind==="mc-sent"){
    const pool=[...Array(N).keys()].filter(i=>i!==idx&&WORDS[i].s!==W.s);
    const others=shuffle(pool).slice(0,3).map(i=>WORDS[i].w);
    return {kind:"mc",idx,prompt:`Choose the word that fits:<br><span class="blank">${W.t.replace("___","______")}</span>`,
      opts:shuffle([W.w,...others]),answer:W.w};
  }
  if(kind==="type-sent") return {kind:"type",kind2:"type-sent",idx,
    prompt:`Type the missing word:<br><span class="blank">${W.t.replace("___","______")}</span>`,answer:W.w};
  return {kind:"type",kind2:"type-word",idx,
    prompt:`Type the word that means:<br><em>${W.d}</em>`,answer:W.w};
}
const near=(a,b)=>{
  a=(a||"").toLowerCase().trim(); b=b.toLowerCase();
  if(a===b) return "exact";
  if(b.length<6||!a) return false;
  const m=[]; for(let i=0;i<=a.length;i++)m[i]=[i];
  for(let j=0;j<=b.length;j++)m[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)
    m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return m[a.length][b.length]<=1?"close":false;
};
let T={end:0,limit:0,live:false};
function startTimer(extra){T.limit=(swordTime(S.tier)+(extra||0))*1000;T.end=performance.now()+T.limit;T.live=true;}
function tickTimer(){
  if(!T.live) return;
  const bar=document.getElementById("tbar"); if(!bar) return;
  const left=Math.max(0,T.end-performance.now()),pct=left/T.limit*100;
  bar.querySelector("i").style.width=pct+"%";
  bar.querySelector("span").textContent=Math.ceil(left/1000)+"s";
  bar.className="timer"+(pct<25?" crit":pct<50?" warn":"");
  if(left<=0){T.live=false;answer(null,true);}
}

        <button class="ghost" id="hM">${q.kind2==="type-sent"?"what it means":"show a sentence"}</button>
        <span class="hud-sub" style="font-size:10px;align-self:center">each nudge costs a little time</span>
      </div>
      <div class="typebox"><input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type the word"><button id="go">Strike</button></div>
      <p class="hud-sub" style="font-size:11px">One slipped letter still lands.</p>`
     :`<div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-o="${i}">${o}</button>`).join("")}</div>`}
    <div id="slot"></div>`);
  startTimer(typing?Math.round(swordTime(S.tier)*0.5):0);
  if(typing){
    const W=WORDS[q.idx], word=q.answer;
    cfg.shown=1; cfg.cueUsed=false;
    const paintScaf=()=>{
      const el=document.getElementById("scaf"); if(!el) return;
      el.innerHTML=word.split("").map((ch,i)=>
        i<cfg.shown?ch:'<span class="hid">·</span>').join("");
      document.getElementById("scaflen").textContent=
        word.length+" letters, starting with \u201c"+word.slice(0,cfg.shown)+"\u201d";
    };
    const spend=()=>{ const left=Math.max(0,T.end-performance.now());
      T.end=performance.now()+left*0.75; };
    paintScaf();
    document.getElementById("hL").onclick=()=>{
      if(cfg.shown>=word.length-1){ document.getElementById("hL").disabled=true; return; }
      cfg.shown++; spend(); paintScaf(); beep(520,.06);
      if(cfg.shown>=word.length-1) document.getElementById("hL").disabled=true;
      document.getElementById("ans").focus();
    };
    document.getElementById("hM").onclick=()=>{
      if(cfg.cueUsed) return;
      cfg.cueUsed=true; spend(); beep(520,.06);
      const box=document.getElementById("cue");
      box.innerHTML = q.kind2==="type-sent" ? W.d : W.t.replace("___","______");
      box.style.display="block";
      document.getElementById("hM").disabled=true;
      document.getElementById("ans").focus();
    };
    const inp=document.getElementById("ans");inp.focus();
    const fire=()=>answer(inp.value,false);
    document.getElementById("go").onclick=fire;
    inp.addEventListener("keydown",e=>{if(e.key==="Enter")fire();});
  }else panel.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(q.opts[+b.dataset.o],false));
  S._cfg=cfg;
}
function answer(given,timedOut){
  if(S.mode!=="q") return;
  T.live=false;
  const cfg=S._cfg,q=cfg.q;
  let ok=false,fuzzy=false;
  if(!timedOut&&given!=null){
    if(q.kind==="type"){const n=near(given,q.answer);ok=!!n;fuzzy=(n==="close");}
    else ok=given===q.answer;
  }
  S.mode="verdict";
  if(q.kind==="mc") panel.querySelectorAll(".opt").forEach(b=>{
    const v=q.opts[+b.dataset.o];b.disabled=true;
    if(v===q.answer)b.classList.add("right"); else if(v===given)b.classList.add("wrong");});
  else{const i=document.getElementById("ans");if(i)i.disabled=true;
       const g=document.getElementById("go");if(g)g.disabled=true;}
  const W=WORDS[q.idx],slot=document.getElementById("slot");
  if(ok){
    beep(660,.09);setTimeout(()=>beep(880,.12),90);
    slot.innerHTML=`<div class="verdict good"><strong>${fuzzy?"Close enough — a hit!":"A clean hit!"}</strong>
      ${fuzzy?`Spelled <b style="color:#f0d264">${q.answer}</b>. `:""}<b style="color:#f0d264">${W.w}</b>
      <span class="respell">${W.r}</span> ${speakBtn(q.idx,"hear it")} — ${W.d}</div>
      <div class="row"><button id="next">Press on</button></div>`;
    wireSpeak(); document.getElementById("next").onclick=()=>cfg.onCorrect();
  }else{
    cfg.missed=true;
    if(cfg.bossHearts!==undefined){cfg.bossHearts--;} else {S.hp--;}
    drawHUD(); beep(160,.2,"sawtooth");
    panel.classList.add("shake");setTimeout(()=>panel.classList.remove("shake"),320);
    const dead = cfg.bossHearts!==undefined ? cfg.bossHearts<=0 : S.hp<=0;
    slot.innerHTML=`<div class="verdict bad"><strong>${timedOut?"Out of time — the blow lands on you.":"Missed."}</strong>
      The word is <b style="color:#f0d264">${q.answer}</b> <span class="respell">${W.r}</span>
      ${speakBtn(q.idx,"hear it",true)}<br>${W.d}<br>
      <em style="color:#cbbf9f">${W.t.replace("___",W.w)}</em></div>
      <div class="row"><button id="next">${dead?"…":"Try again"}</button></div>`;
    wireSpeak();
    document.getElementById("next").onclick=()=> dead?cfg.onDefeat():cfg.onWrong();
  }
  autosave();
}

/* ---------- new word ---------- */
function paintFoe(id,sp,scale,pal){
  const cv=document.getElementById(id); if(!cv) return;
  const c=cv.getContext("2d"); c.clearRect(0,0,cv.width,cv.height);
  drawSprite(c,sp,0,0,scale||6,1,pal);
}
function startNew(m){
  const W=WORDS[m.i];
  S.enc={m,idx:m.i,hp:2,step:0,fresh:true};
  S.mode="msg";
  openPanel(`<div class="stage"><canvas width="72" height="72" id="foe"></canvas>
      <div class="stage-txt"><div class="foe">A ${m.sp} guards a new word</div><div class="foehp">♦♦</div></div></div>
    <div class="wordline"><h2 class="word">${W.w}</h2><span class="respell">${W.r}</span>
      ${speakBtn(m.i,"hear it")}${speakBtn(m.i,"hear a sentence",true)}</div>
    <p class="def">${W.d}</p>
    <p class="ex">${W.t.replace("___",W.w)}</p>
    <div class="row"><button id="fight">Draw your sword</button><button class="ghost" id="flee">Walk away</button></div>`);

  document.getElementById("fight").onclick=encQ;
  document.getElementById("flee").onclick=closePanel;
}
function encStage(){
  const e=S.enc;
  const hp="♦".repeat(e.hp)+`<span class="gone">${"♦".repeat(2-e.hp)}</span>`;
  return `<div class="stage"><canvas width="72" height="72" id="foe"></canvas>
    <div class="stage-txt"><div class="foe">${e.m.sp} · ${WORDS[e.idx].w}</div>
    <div class="foehp">${hp}</div></div></div>`;
}
function encQ(){
  const kind=S.enc.step===0?"mc-syn":(Math.random()<.5?"type-sent":"type-word");
  renderQuestion({q:makeQ(S.enc.idx,kind),stageHTML:encStage(),
    onCorrect(){S.enc.hp--; if(S.enc.hp>0){S.enc.step++;encQ();} else rateWord();},
    onWrong(){encQ();}, onDefeat(){retreat();}});
  setTimeout(()=>paintFoe("foe",S.enc.m.sp),0);
}
function rateWord(){
  const idx=S.enc.idx,W=WORDS[idx];
  S.mode="msg";
  openPanel(`<h2 class="title">${W.w} is yours</h2>
    <div class="wordline"><span class="respell">${W.r}</span>${speakBtn(idx,"hear it")}</div>
    <p class="body">${W.d}</p>
    <p class="body" style="color:#7d7361">Be honest — how well do you know it? This decides how soon
      its spirit comes back to test you.</p>
    <div class="rate">
      <button data-b="1"><b>Still fuzzy</b><small>Comes back almost right away</small></button>
      <button data-b="2"><b>Getting there</b><small>Comes back after a few fights</small></button>
      <button data-b="3"><b>I've got it</b><small>Comes back much later</small></button>
    </div>`);
  wireSpeak();
  panel.querySelectorAll(".rate button").forEach(b=>b.onclick=()=>{
    S.box[idx]=+b.dataset.b; finishFight(idx);
  });
}

/* ---------- review ---------- */
function startReview(m){
  const W=WORDS[m.i], b=S.box[m.i]||1;
  S.enc={m,idx:m.i,fresh:false};
  S.mode="msg";
  openPanel(`<div class="stage"><canvas width="72" height="72" id="foe"></canvas>
      <div class="stage-txt"><div class="foe spirit">A spirit of a word you met</div>
      <div class="foehp" style="color:${BOXCOL[b]}">${"★".repeat(b)}<span class="gone">${"★".repeat(MASTER-b)}</span></div></div></div>
    <h2 class="title">It will not say the word</h2>
    <p class="body">One question. Answer it and the word grows stronger and stays away longer.
      Miss it and the word slips back and returns soon.</p>
    <div class="row"><button id="go">Face it</button><button class="ghost" id="no">Walk away</button></div>`);
  paintFoe("foe","ghost",6,spiritPal(b));
  document.getElementById("go").onclick=revQ;
  document.getElementById("no").onclick=closePanel;
}
function revQ(){
  const idx=S.enc.idx,b=S.box[idx]||1;
  renderQuestion({q:makeQ(idx,BOXQ[b]),
    stageHTML:`<div class="stage"><canvas width="72" height="72" id="foe"></canvas>
      <div class="stage-txt"><div class="foe spirit">spirit · ${"★".repeat(b)}</div></div></div>`,
    onCorrect(){
      if(!this.missed) S.box[idx]=Math.min(MASTER,S.box[idx]+1);
      else S.box[idx]=Math.max(1,S.box[idx]-(S.box[idx]>=MASTER?1:2));
      finishFight(idx);
    },
    onWrong(){revQ();}, onDefeat(){retreat();}});
  setTimeout(()=>paintFoe("foe","ghost",6,spiritPal(b)),0);
}

/* ---------- shared end of fight ---------- */
function finishFight(idx){
  S.battles++; S.lastB[idx]=S.battles; S.streak=Math.min(FORGE_AT,S.streak+1);
  S.recent=[idx,...S.recent.filter(i=>i!==idx)].slice(0,FORGE_AT);
  S.mons=S.mons.filter(m=>m!==S.enc.m);
  fillMap(); drawHUD(); autosave();
  const W=WORDS[idx], b=S.box[idx];
  const done=masteredCount()===N;
  S.mode="msg";
  openPanel(`<h2 class="title">${W.w} — ${"★".repeat(b)}${"☆".repeat(MASTER-b)}</h2>
    <p class="body">${b>=MASTER?"Mastered. It will only check on you rarely now.":W.d}</p>
    <p class="body">Mastered: ${masteredCount()} of ${N}. ${dueList().length} words are waiting on the map.</p>
    ${S.streak>=FORGE_AT?`<p class="body">The forge is lit. Go and earn a better blade.</p>`:""}
    ${done?`<p class="body"><em>Every word in the book is mastered. The Wyrm has nothing left to hide behind.</em></p>`:""}
    <div class="row"><button id="ok">Back to the map</button></div>`);
  document.getElementById("ok").onclick=()=>{S.enc=null;closePanel();};
}
function retreat(){
  S.hp=S.maxhp; drawHUD(); autosave(); S.mode="msg";
  openPanel(`<h2 class="title">You retreat</h2>
    <p class="body">Your health returns and nothing is lost. The word is still out there.</p>
    <div class="row"><button id="ok">Back to the map</button></div>`);
  document.getElementById("ok").onclick=()=>{S.enc=null;S.forge=null;S.boss=null;closePanel();};
}

/* ---------- forge ---------- */
function bumpForge(){
  if(!forgeUseful()) return say("The forge is spent",
    "The smith has given you everything he has — the blade is at its limit and your health is full. " +
    "What is left is the book itself, and the Wyrm.");
  if(S.streak<FORGE_AT) return say("The forge is dark",
    `The smith works only after five words. You have ${S.streak} of ${FORGE_AT}.`);
  const picks=S.recent.slice(0,3);
  if(picks.length<3) return say("The forge is dark","Take on a few more words first.");
  const kinds=shuffle(["mc-syn","mc-sent","type-word","type-sent"]).slice(0,3);
  S.forge={q:picks.map((p,i)=>({idx:p,kind:kinds[i]})),step:0};
  S.mode="msg";
  openPanel(`<div class="stage"><canvas width="72" height="72" id="foe"></canvas>
      <div class="stage-txt"><div class="foe" style="color:#e8a33d">The forge is lit</div></div></div>
    <h2 class="title">Prove the last five</h2>
    <p class="body">Three questions from the words you just fought. Answer all three and the smith
      ${S.tier<TIERCAP?`hammers out the <em>${swordName(S.tier+1)}</em>, worth
        <em>${swordTime(S.tier+1)} seconds</em> an answer instead of ${swordTime(S.tier)}`
      :`beats a new heart into your armour — <em>${S.maxhp+1} health</em> instead of ${S.maxhp}`}.</p>
    <div class="row"><button id="go">Begin the test</button><button class="ghost" id="no">Not yet</button></div>`);
  paintFoe("foe","forge");
  document.getElementById("go").onclick=forgeQ;
  document.getElementById("no").onclick=closePanel;
}
function forgeQ(){
  const f=S.forge,item=f.q[f.step];
  renderQuestion({q:makeQ(item.idx,item.kind),
    stageHTML:`<div class="stage"><canvas width="72" height="72" id="foe"></canvas>
      <div class="stage-txt"><div class="foe" style="color:#e8a33d">Forge test</div>
      <div class="foehp" style="color:#e8a33d">${f.step+1} of 3</div></div></div>`,
    onCorrect(){f.step++;f.step<3?forgeQ():forgeDone();},
    onWrong(){S.box[item.idx]=Math.max(1,S.box[item.idx]-(S.box[item.idx]>=MASTER?1:2));forgeQ();},
    onDefeat(){retreat();}});
  setTimeout(()=>paintFoe("foe","forge"),0);
}
function forgeDone(){
  const gotSword = S.tier<TIERCAP;
  if(gotSword) S.tier++; else if(S.maxhp<MAXHP) S.maxhp++;
  S.streak=0; S.hp=S.maxhp; drawHUD(); autosave();
  const L=swordLook(S.tier);
  S.mode="msg";
  openPanel(`<div class="stage"><canvas width="72" height="72" id="foe"></canvas>
      <div class="stage-txt"><div class="foe" style="color:#f0d264">${gotSword?swordName(S.tier):S.maxhp+" health"}</div></div></div>
    <h2 class="title">${gotSword?"The blade is yours":"Your armour is stronger"}</h2>
    <p class="body">${gotSword?`You now have <em>${swordTime(S.tier)} seconds</em> to answer`
      :`You can now take <em>${S.maxhp} hits</em> before retreating`}, and your health is restored.</p>
    <p class="body">The Wyrm's shrine is open whenever you want to try it.</p>
    <div class="row"><button id="ok">Back to the map</button><button class="ghost" id="boss">Challenge the Wyrm</button></div>`);
  const cv=document.getElementById("foe");
  if(cv) drawSprite(cv.getContext("2d"),"sword",6,0,6,1,{b:L.blade,g:L.guard,h:L.grip});
  document.getElementById("ok").onclick=()=>{S.forge=null;closePanel();};
  document.getElementById("boss").onclick=()=>{S.forge=null;startBoss();};
}

/* ---------- boss ---------- */
function bossPool(){
  const weak=[];
  for(let i=0;i<N;i++) if(S.box[i]>0&&S.box[i]<MASTER) weak.push(i);
  weak.sort((a,b)=>S.box[a]-S.box[b]);
  let pool=shuffle(weak.slice(0,Math.max(BOSS_SCALES*2,weak.length))).slice(0,BOSS_SCALES);
  if(pool.length<BOSS_SCALES){
    const un=shuffle(unseenList()).slice(0,BOSS_SCALES-pool.length);
    pool=pool.concat(un);
  }
  if(pool.length<BOSS_SCALES){
    const mast=shuffle([...Array(N).keys()].filter(i=>S.box[i]>=MASTER)).slice(0,BOSS_SCALES-pool.length);
    pool=pool.concat(mast);
  }
  return shuffle(pool);
}
function startBoss(){
  const pool=bossPool();
  const unknown=pool.filter(i=>!S.box[i]).length;
  S.boss={queue:pool,broken:0,hearts:BOSS_HEARTS};
  S.mode="msg";
  openPanel(`<div class="stage boss"><canvas width="110" height="110" id="foe"></canvas>
      <div class="stage-txt"><div class="foe">The Lexicon Wyrm</div>
      <div class="foehp">${BOSS_SCALES} scales · ${BOSS_HEARTS} hearts</div></div></div>
    <h2 class="title">Ten scales, three hearts</h2>
    <p class="body">The Wyrm picks the words you know least well. Break all ten scales before it takes
      three hearts.</p>
    ${unknown?`<p class="body">Careful — <em>${unknown}</em> of these are words you have never met. If one
      beats you, the Wyrm will teach it, and it joins your book.</p>`:
      `<p class="body">Every word here is one you have already met.</p>`}
    <p class="body" style="color:#7d7361">Mastered so far: ${masteredCount()} of ${N}. The more you master,
      the fewer weak words the Wyrm has to choose from.</p>
    <div class="row"><button id="go">Face the Wyrm</button><button class="ghost" id="no">Not yet</button></div>`);
  const cv=document.getElementById("foe"); if(cv) drawSprite(cv.getContext("2d"),"wyrm",0,0,6.8,1);
  document.getElementById("go").onclick=bossQ;
  document.getElementById("no").onclick=closePanel;
}
function bossQ(){
  const B=S.boss, idx=B.queue[0], b=S.box[idx];
  const kind = b ? BOXQ[b] : "mc-syn";   // never-met words get the gentlest format
  renderQuestion({
    q:makeQ(idx,kind), bossHearts:B.hearts,
    stageHTML:`<div class="stage boss"><canvas width="110" height="110" id="foe"></canvas>
      <div class="stage-txt"><div class="foe">Lexicon Wyrm</div>
      <div class="foehp">${BOSS_SCALES-B.broken} scale${BOSS_SCALES-B.broken===1?"":"s"} ·
        ${"♥".repeat(B.hearts)}<span class="gone">${"♥".repeat(BOSS_HEARTS-B.hearts)}</span></div></div></div>`,
    onCorrect(){
      B.hearts=this.bossHearts; B.broken++; B.queue.shift();
      if(S.box[idx]) S.box[idx]=Math.min(MASTER,S.box[idx]+1);
      S.battles++; S.lastB[idx]=S.battles;
      B.broken>=BOSS_SCALES?bossWin():bossQ();
    },
    onWrong(){
      B.hearts=this.bossHearts;
      if(!S.box[idx]){ S.box[idx]=1; S.battles++; S.lastB[idx]=S.battles; }
      else S.box[idx]=Math.max(1,S.box[idx]-(S.box[idx]>=MASTER?1:2));
      B.queue.push(B.queue.shift());
      drawHUD(); bossQ();
    },
    onDefeat(){
      B.hearts=0;
      if(!S.box[idx]){ S.box[idx]=1; S.battles++; S.lastB[idx]=S.battles; }
      bossLose();
    }});
  setTimeout(()=>{const cv=document.getElementById("foe"); if(cv) drawSprite(cv.getContext("2d"),"wyrm",0,0,6.8,1);},0);
}
function bossWin(){
  S.crowns++; if(S.tier<TIERCAP) S.tier++; S.hp=S.maxhp; fillMap(); drawHUD(); autosave();
  const done=masteredCount()===N;
  S.mode="msg";
  openPanel(`<h2 class="title">${done?"The Wyrm falls for good":"A crown is taken"}</h2>
    <p class="body">Ten scales broken. You take a crown${S.tier<TIERCAP?`, and the smith upgrades you to the
      <em>${swordName(S.tier)}</em>`:""}.</p>
    ${done?`<p class="body">Every one of the ${N} words is mastered. There is nothing left in the book
      the Wyrm can use against you. That is the whole quest.</p>`
    :`<p class="body">It will rebuild its scales from whatever you still know least well.
      ${masteredCount()} of ${N} mastered. Crowns: ${S.crowns}.</p>`}
    <div class="row"><button id="ok">Back to the map</button></div>`);
  document.getElementById("ok").onclick=()=>{S.boss=null;closePanel();};
}
function bossLose(){
  const B=S.boss; S.hp=S.maxhp; fillMap(); drawHUD(); autosave(); S.mode="msg";
  openPanel(`<h2 class="title">The Wyrm drives you back</h2>
    <p class="body">You broke ${B.broken} of ${BOSS_SCALES} scales. Every word it beat you with has been
      added to your book at one star, so the spirits will bring them straight back to you.</p>
    <p class="body">Clear the spirits on the map, then try again. The Wyrm gets weaker every time you master
      a word, because it has fewer weak ones left to pick from.</p>
    <div class="row"><button id="ok">Back to the map</button><button class="ghost" id="again">Straight back in</button></div>`);
  document.getElementById("ok").onclick=()=>{S.boss=null;closePanel();};
  document.getElementById("again").onclick=startBoss;
}

/* ---------- codex ---------- */
document.getElementById("codexBtn").onclick=()=>{
  if(S.mode==="q"||S.mode==="verdict") return;
  S.mode="msg";
  openPanel(`<h2 class="title">Codex — ${masteredCount()} mastered of ${N}</h2>
    <div class="filters">
      <input id="cxq" placeholder="search a word" autocomplete="off">
      <select id="cxf">
        <option value="seen">Words I've met (${seenCount()})</option>
        <option value="weak">Weakest first</option>
        <option value="due">Due now (${dueList().length})</option>
        <option value="mast">Mastered (${masteredCount()})</option>
        <option value="all">Everything (${N})</option>
      </select>
    </div>
    <div class="codex" id="cxList"></div>
    <div class="row"><button id="ok">Close</button></div>`);
  const render=()=>{
    const q=(document.getElementById("cxq").value||"").toLowerCase().trim();
    const f=document.getElementById("cxf").value;
    let ids=[...Array(N).keys()];
    if(f==="seen") ids=ids.filter(i=>S.box[i]>0);
    else if(f==="weak") ids=ids.filter(i=>S.box[i]>0).sort((a,b)=>S.box[a]-S.box[b]);
    else if(f==="due") ids=dueList();
    else if(f==="mast") ids=ids.filter(i=>S.box[i]>=MASTER);
    if(q) ids=ids.filter(i=>WORDS[i].w.includes(q)||WORDS[i].d.toLowerCase().includes(q));
    document.getElementById("cxList").innerHTML = ids.length? ids.slice(0,120).map(i=>{
      const W=WORDS[i],b=S.box[i];
      if(!b) return `<div class="item"><b style="color:#7d7361">${W.w}</b>
        <p class="strength">not met yet</p></div>`;
      return `<div class="item s${b}">
        <div class="wordline"><b>${W.w}</b><span class="respell">${W.r}</span>${speakBtn(i,"hear it")}</div>
        <p class="strength">${"★".repeat(b)}${"☆".repeat(MASTER-b)}</p>
        <p>${W.d}</p><p style="color:#9c917a">${W.t.replace("___",W.w)}</p></div>`;
    }).join("") : `<p class="body" style="color:#7d7361">Nothing matches that.</p>`;
    wireSpeak();
  };
  document.getElementById("cxq").addEventListener("input",render);
  document.getElementById("cxf").addEventListener("change",render);
  document.getElementById("ok").onclick=closePanel;
  render();
};

/* ---------- save panel ---------- */
document.getElementById("saveBtn").onclick=()=>{
  if(S.mode==="q"||S.mode==="verdict") return;
  S.mode="msg";
  const code=toCode();
  openPanel(`<h2 class="title">Saving your quest</h2>
    <p class="body">${AUTOSAVE?"This quest saves itself after every question and picks up where you left off next time you open it here."
      :"Automatic saving isn't available in this window, so use the code below."}</p>
    <p class="body" style="color:#7d7361">The code holds all ${N} words and how strong each one is.
      Copy it into a note or email it to yourself, and you can paste it back on any computer to carry on.</p>
    <textarea class="code" id="outCode" readonly>${code}</textarea>
    <div class="row"><button id="copy">Copy the code</button></div>
    <p class="body" style="margin-top:20px">Have a code from before? Paste it here.</p>
    <textarea class="code" id="inCode" placeholder="paste a save code"></textarea>
    <div class="row"><button id="load">Load this code</button><button class="ghost" id="ok">Close</button></div>
    <div id="msg"></div>`);
  const out=document.getElementById("outCode");
  document.getElementById("copy").onclick=async()=>{
    try{await navigator.clipboard.writeText(code);}catch(e){out.select();try{document.execCommand("copy");}catch(_){}}
    document.getElementById("msg").innerHTML=`<div class="verdict good"><strong>Copied</strong>Paste it somewhere safe.</div>`;
  };
  document.getElementById("load").onclick=()=>{
    const v=document.getElementById("inCode").value; if(!v.trim()) return;
    if(fromCode(v)){ drawHUD();
      document.getElementById("msg").innerHTML=`<div class="verdict good"><strong>Quest loaded</strong>${masteredCount()} of ${N} mastered, ${seenCount()} words met.</div>`;
    }else document.getElementById("msg").innerHTML=`<div class="verdict bad"><strong>That code didn't read</strong>Check the whole code was pasted with nothing cut off.</div>`;
  };
  document.getElementById("ok").onclick=closePanel;
};

/* ---------- title ---------- */
function title(){
  S.mode="msg";
  const resumed=seenCount()>0;
  openPanel(`<h2 class="title">Lexicon Quest</h2>
    <p class="body">There are <em>${N}</em> hard words in this book. Monsters carry the ones you have never met;
      coloured spirits carry the ones you have. Beat a monster and the word is yours.</p>
    <p class="body">Every word has four stars. It gains one each time you beat its spirit and loses two when
      you miss. Four stars means mastered, and the whole quest is mastering all ${N}.</p>
    <p class="body">Every five fights the forge lights up and tests you on those five. Pass and your sword
      improves, which buys you more seconds to think.</p>
    <p class="body">The Wyrm's shrine is always open. It picks the ten words you know least well, so early on
      it will beat you — and it teaches you every word it beats you with.</p>
    <p class="body">When you have to type a word you get its first letter and its length, and two nudges you
      can tap if you are stuck — one more letter, or the other half of the clue. Nudges only cost time,
      never a heart.</p>
    <p class="body" style="color:#7d7361;font-size:13px">Arrow keys or WASD. Every word has a <em>hear it</em>
      button. The quest saves itself, and <em>Save</em> gives you a code to carry it to another computer.</p>
    <div class="row"><button id="go">${resumed?"Continue":"Begin"}</button></div>`);
  document.getElementById("go").onclick=closePanel;
}

/* ---------- boot ---------- */
(async function(){
  await autoload();
  fillMap(); drawHUD(); title(); loop();
})();
</script>
